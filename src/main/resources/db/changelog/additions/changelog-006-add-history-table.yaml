databaseChangeLog:
  - changeSet:
      id: changelog-006-add-history-table
      author: Konstantin
      changes:
        - createTable:
            tableName: operations_history
            columns:
              - column:
                  name: oh_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: oh_user_id
                  type: bigint
                  constraints:
                    references: users(id)
                    foreignKeyName: fk_oh_to_users_id
                    nullable: false
              - column:
                  name: oh_operation_type
                  type: varchar2
              - column:
                  name: oh_gen_input
                  type: varchar2
              - column:
                  name: oh_balance_change
                  type: float
              - column:
                  name: oh_timestamp
                  type: timestamp