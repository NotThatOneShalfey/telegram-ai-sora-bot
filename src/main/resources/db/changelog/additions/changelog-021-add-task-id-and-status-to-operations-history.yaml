databaseChangeLog:
  - changeSet:
      id: changelog-021-add-task-id-and-status-to-operations-history
      author: Konstantin
      changes:
        - addColumn:
            tableName: operations_history
            columns:
              - column:
                  name: oh_task_id
                  type: varchar(128)
                  remarks: "ID задачи от внешнего API (заполняется при успешном ответе на запрос генерации)"
              - column:
                  name: oh_status
                  type: varchar(32)
                  remarks: "Статус генерации: REQUESTED, PROCESSING, SUCCESS, FAILED"
